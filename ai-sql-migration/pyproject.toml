[project]
name = "ai-sql-migration"
version = "0.1.0"
description = "AI-powered SQL migration agent using LangGraph and Anthropic Claude"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.94.1",
    "databricks-sql-connector>=4.2.5",
    "langchain-anthropic>=1.4.0",
    "langchain-core>=1.2.28",
    "langgraph>=1.1.6",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.2",
    "sqlfluff>=4.1.0",
    "rich>=15.0.0",
]

[project.scripts]
ai-sql-migration = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
