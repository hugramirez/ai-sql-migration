[project]
name = "ai-sql-migration"
version = "0.1.0"
description = "AI-powered SQL migration agent using LangGraph and Anthropic Claude"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.94.1",
    "databricks-sql-connector>=4.2.5",
    "langgraph>=1.1.6",
    "python-dotenv>=1.2.2",
]

[project.scripts]
ai-sql-migration = "main:main"
